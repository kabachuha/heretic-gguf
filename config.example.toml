# heretic-gguf example configuration.
# Copy to config.toml and fill in the paths below — everything else is a
# sane generic starting point. See README.md for the full workflow.

# Path to the model: the FIRST shard of a (possibly multi-shard) GGUF.
model = "/path/to/your-model-00001-of-0000N.gguf"

# The heretic-eval binary, built from harness/heretic-eval against the
# llama.cpp commit pinned in LLAMA_CPP_PIN (see README.md, Installation).
harness_binary = "/path/to/llama.cpp/build/bin/heretic-eval"

# Optional: external jinja chat template file. Leave empty to use the
# template embedded in the GGUF (recommended when the GGUF ships one).
chat_template_file = ""

# Scratch dir for trial adapters and job files — a tmpfs is ideal.
shm_dir = "/dev/shm/heretic_gguf"

# Max seconds the harness may go WITHOUT a stdout line before it is treated
# as wedged (and respawned on the next retry). The harness prints a
# PROGRESS line after every completed prompt of RESIDUALS/LOGITS/GENERATE,
# so this bounds a single STUCK prompt, not the total command duration: a
# slow-but-healthy command of any length survives. Leave at the default
# (1800 = 30 min of no progress) unless you have a reason to detect a wedged
# prompt faster or slower.
harness_cmd_timeout = 1800.0

# ---------------------------------------------------------------------------
# Extra llama.cpp flags for the harness.
#
# Generic starting point (full GPU offload — works whenever the GGUF
# already fits for inference):
harness_args = [
    "-ngl", "999",
    "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0",
    "-c", "4096", "-b", "2048", "-ub", "512", "-np", "8",
]
#
# Context size: Heretic evaluation only needs a short chat-templated prompt
# plus max_response_length (~100) generated tokens per sequence, and the
# total context (-c) is shared between the -np parallel generation slots
# (per-slot context = c / np). 4096 with -np 8 gives 512 tokens per slot,
# which is plenty. Only raise -c if your prompts are unusually long.
#
# EXAMPLE — multi-GPU tensor split with MoE expert layer pinning.
# Spread the model over 4 GPUs proportionally to their VRAM, pin the fused
# expert tensors (usually the bulk of an MoE model) round-robin across the
# devices, and offload the remaining experts to CPU RAM:
#
# harness_args = [
#     "-ngl", "999",
#     "-ts", "32,24,24,24", "--main-gpu", "0",
#     "-ot", "blk.(0|1|2|3|4|5|6).ffn_(gate|up|down)_exps=CUDA0,blk.(7|8|9|10|11|12).ffn_(gate|up|down)_exps=CUDA1,blk.(13|14|15|16|17|18).ffn_(gate|up|down)_exps=CUDA2,blk.(19|20|21|22|23|24).ffn_(gate|up|down)_exps=CUDA3,ffn_(gate|up|down)_exps=CPU",
#     "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0",
#     "-c", "4096", "-b", "2048", "-ub", "512", "-np", "8",
# ]
#
#   * -ts (tensor split): relative VRAM shares per device — using each
#     GPU's size in GB is a good approximation.
#   * -ot (override-tensor): pins tensors matching a regex to a device.
#     "ffn_(gate|up|down)_exps" matches the fused MoE expert tensors of
#     every layer; the layer-numbered rules above pin blocks 0-24 to
#     CUDA0-3, and the final catch-all "ffn_(gate|up|down)_exps=CPU"
#     offloads all remaining expert tensors to CPU (partial CPU offload —
#     drop that rule to keep everything on GPU). Adjust the layer ranges
#     to your model's block count and your GPUs' capacities.
#   * IMPORTANT: -ot must be ONE comma-joined argument. Repeating the
#     flag is deprecated in current llama.cpp and only the last occurrence
#     is used, which silently misplaces tensors (usually an OOM on load).
#   * CUDA_DEVICE_ORDER=PCI_BUS_ID must be set for CUDA<N> device indices
#     to be stable (default order is fastest-first). heretic_gguf.harness
#     sets it automatically; export it yourself when running the harness
#     binary or llama-server manually.

# Ablation
row_normalization = "pre"        # "pre" recommended for GGUF; "full" = exact but slow
adapter_dtype = "f16"
components = ["attn.o_proj", "mlp.down_proj"]   # add "mlp.down_proj.shared" if wanted
orthogonalize_direction = true

# Multi-directional abliteration via Self-Organizing Maps (Kohonen maps) —
# p-e-w/heretic PR #196 + Piras et al. "SOM Directions are Better than One"
# (arXiv:2511.08379): the refusal concept spans a low-dim manifold, so a
# per-layer SOM over the harmful residuals yields som_k directions instead
# of one. The cached directions go to a SEPARATE file (directions_som.pt),
# so single- and multi-direction results coexist. Use a distinct study_name
# for a SOM study (the Optuna parameter space differs: per-direction
# max/min weights). Needs 'pip install minisom'.
multidirectional_som = false
som_x = 4                # SOM grid: neurons on the x-axis
som_y = 4                # SOM grid: neurons on the y-axis
som_iterations = 10000   # SOM training iterations (per layer)
som_lr = 0.01            # SOM learning rate
som_sigma = 0.5          # SOM neighborhood radius (Gaussian)
som_k = 4                # top-k neurons -> directions per layer

# Per-expert ablation: "shared" (classic), "grouped" (8 Optuna-controlled groups),
# or "routing" (frequency-ratio driven, zero extra Optuna dimensions; run
# `directions` with this mode set to collect the stats first).
expert_mode = "grouped"
expert_groups = 8
# routing_stats_file = "checkpoints/routing_stats.npy"   # default when unset

# Reasoning models: skip the CoT block so evaluation starts at the actual
# response (same mechanism as Heretic's chain_of_thought_skips). Leave
# empty for non-reasoning models; the per-arch default usually does the
# right thing (see heretic_gguf/archs.py).
# response_prefix = "<think></think>"

# Two-stage evaluation: every trial is ranked on the cheap stage A set
# (32 prompts x 64 tokens below); afterwards the selected trials are
# re-scored with the full eval sets and their scores_stage_b recorded.
# KL always uses the full harmless set (prefill-only, cheap).
two_stage = false
stage_a_harmful_prompts = "hf:mlabonne/harmful_behaviors:test[:32]:text"
stage_a_max_response_length = 64
stage_b_top_k = 10
# Stage B selection: "pareto" fills non-dominated fronts in order up to
# stage_b_top_k; "threshold" instead re-scores EVERY trial whose stage A
# scores pass both cutoffs (best first, still capped at stage_b_top_k).
# Stage A kw is optimistic, so threshold mode casts a wider net for export
# candidates. Individual trials can always be re-scored on demand with
# `optimize --stage-b-trials N[,N...]`.
# stage_b_select = "pareto"           # "pareto" | "threshold"
# stage_b_max_keyword_rate = 0.25     # threshold mode: stage A kw <= this
# stage_b_max_kl = 0.10               # threshold mode: stage A KL <= this

n_trials = 200
n_startup_trials = 60
study_checkpoint_dir = "checkpoints"

# Per-component max_weight search ranges [lo, hi]. Defaults are Heretic's
# hardcoded values; MLP lo < 0 is clamped to 0 so TPE can disable the
# component. Widen attn hi when good trials pile up at the 1.5 ceiling.
# attn_max_weight_range = [0.8, 2.5]
# mlp_max_weight_range = [-0.25, 1.5]

# Seed a fresh study with the top trials of a previous one (re-runs them so
# TPE starts with history; counts toward n_trials; no-op on resume).
# NOTE: change `seed` too, or the startup trials replay the old study's
# random sequence.
# seed_from_checkpoint_dir = "checkpoints/previous-study"
# seed_from_study = "overnight"
# seed_top_k = 10

# Datasets — each key takes a single spec string (below) or a LIST of specs,
# mixed freely between HF datasets and local prompt files:
#   "hf:<repo>:<split[:slice]>:<column>"   (downloaded once, cached as jsonl)
#   "file:/path/prompts.txt[:slice]"       (one prompt per line, UTF-8; blank
#                                           lines and '#' comments skipped;
#                                           slices allow negatives: "[-20:]"
#                                           = last 20 lines)
# With a list, each spec's own [:N] slice applies to THAT spec only; the
# results are concatenated and deduplicated (first occurrence wins). Keyword
# eval output then splits the refusal count per origin, e.g.
#   23/52 = 44.23% [13/32 (base), 10/20 (user)]
# ("base" = hf: specs, "user" = file: specs).
#
# "hf:" specs are downloaded ONCE and cached as plain jsonl under
# dataset_cache_dir (default: <study_checkpoint_dir>/../datasets, i.e.
# checkpoints/datasets below); later runs read the cache with zero network
# calls (HF_HUB_OFFLINE=1 works). Set refresh_datasets = true or pass
# --refresh-datasets to force a re-download. "file:" specs are local already
# and are never cached.
# dataset_cache_dir = "checkpoints/datasets"
# refresh_datasets = false
good_prompts = "hf:mlabonne/harmless_alpaca:train[:400]:text"
bad_prompts = "hf:mlabonne/harmful_behaviors:train[:400]:text"
eval_harmful_prompts = "hf:mlabonne/harmful_behaviors:test[:100]:text"
eval_harmless_prompts = "hf:mlabonne/harmless_alpaca:test[:100]:text"

# EXAMPLE — extend the harmful eval set with your own jailbreak prompts:
# copy examples/custom_prompts.txt, replace its lines with your prompts
# (one per line), and add it as a second spec:
#
# eval_harmful_prompts = [
#     "hf:mlabonne/harmful_behaviors:test[:100]:text",
#     "file:my_jailbreaks.txt",          # or "file:my_jailbreaks.txt[:50]"
# ]
#
# Or replace a set entirely with your own file:
#   eval_harmless_prompts = "file:my_harmless_prompts.txt"
#
# NOTE — cache interaction: the cached directions.pt and the cached study
# baseline fingerprint the dataset SPECS, so adding/removing/changing a spec
# invalidates them automatically (directions are recomputed, the baseline is
# re-measured). But EDITING THE CONTENTS of an existing file: path leaves
# the spec string unchanged, so the caches are NOT invalidated in that case:
# rerun `directions` (or `run --force-directions`) and delete
# checkpoints/<study>.baseline.pt after changing a prompt file.
